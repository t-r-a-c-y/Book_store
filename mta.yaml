_schema-version: 3.3.0
ID: tracy-bookstore
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: tracy-bookstore-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tracy-bookstore-auth
      - name: tracy-bookstore-db
      - name: tracy-bookstore-destination

  - name: tracy-bookstore-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tracy-bookstore-db

resources:
  - name: tracy-bookstore-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: tracy-bookstore-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - "https://oauth.pstmn.io/v1/callback"
          credential-types:
            - "binding-secret"
            - "x509"

  - name: tracy-bookstore-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: tracy-bookstore-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
